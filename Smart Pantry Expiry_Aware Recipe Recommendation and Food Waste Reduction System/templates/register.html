{% extends "auth_base.html" %}
{% block title %}Register - Smart Pantry{% endblock %}

{% block auth_content %}
<div class="card shadow border-0 auth-card">
    <div class="card-body p-4 p-md-5">
        <div class="text-center mb-4">
            <div class="display-4 mb-2">🥦</div>
            <h4 class="fw-bold text-dark">Create Account</h4>
            <p class="text-muted small">Join Smart Pantry and reduce food waste</p>
        </div>

        <form method="POST" action="{{ url_for('auth.register') }}">
            <div class="mb-3">
                <label for="name" class="form-label fw-semibold">Full Name</label>
                <input type="text" class="form-control form-control-lg" id="name" name="name"
                       required autofocus placeholder="Your full name">
            </div>
            <div class="mb-3">
                <label for="email" class="form-label fw-semibold">Email address</label>
                <input type="email" class="form-control form-control-lg" id="email" name="email"
                       required placeholder="you@example.com">
            </div>
            <div class="mb-3">
                <label for="password" class="form-label fw-semibold">Password</label>
                <input type="password" class="form-control form-control-lg" id="password" name="password"
                       required minlength="6" placeholder="Min. 6 characters">
                <div class="form-text">Must be at least 6 characters long.</div>
            </div>
            <div class="mb-4">
                <label for="confirm_password" class="form-label fw-semibold">Confirm Password</label>
                <input type="password" class="form-control form-control-lg" id="confirm_password"
                       name="confirm_password" required minlength="6" placeholder="Repeat password">
            </div>
            <button type="submit" class="btn btn-success btn-lg w-100 rounded-pill shadow-sm mb-3">
                <i class="bi bi-person-plus me-2"></i>Register
            </button>
        </form>

        <div class="text-center">
            <span class="text-muted">Already have an account?</span>
            <a href="{{ url_for('auth.login') }}" class="text-success text-decoration-none fw-bold ms-1">Login here</a>
        </div>
    </div>
</div>
{% endblock %}
